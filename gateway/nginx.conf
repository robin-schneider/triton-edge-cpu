user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 10m;

  upstream triton_http {
    server triton:8000;
    keepalive 32;
  }

  upstream triton_metrics {
    server triton:8002;
    keepalive 4;
  }

  upstream triton_grpc {
    server triton:8001;
    keepalive 32;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/triton/tls/server.crt;
    ssl_certificate_key /etc/triton/tls/server.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /metrics {
      proxy_pass http://triton_metrics/metrics;
    }

    location / {
      proxy_pass http://triton_http;
    }
  }

  server {
    listen 8444 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/triton/tls/server.crt;
    ssl_certificate_key /etc/triton/tls/server.key;

    location / {
      grpc_pass grpc://triton_grpc;
      grpc_read_timeout 1h;
      grpc_send_timeout 1h;
    }
  }
}

